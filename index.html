<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scoop · Legal</title>
    <style>
        :root {
            --text: #171717;
            --muted: #737373;
            --link: #c4720a;
            --bg: #ffffff;
            --border: #e5e5e5;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: var(--text);
            background: var(--bg);
            line-height: 1.6;
        }

        main {
            max-width: 720px;
            margin: 0 auto;
            padding: 64px 24px;
        }

        h1 {
            font-size: 36px;
            font-weight: 700;
            margin: 0 0 8px;
        }

        .tag {
            color: var(--muted);
            font-size: 14px;
            margin-bottom: 48px;
        }

        ul.nav {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        ul.nav li {
            border-top: 1px solid var(--border);
        }

        ul.nav li:last-child {
            border-bottom: 1px solid var(--border);
        }

        ul.nav a {
            display: block;
            padding: 20px 4px;
            color: var(--text);
            text-decoration: none;
            font-size: 18px;
            font-weight: 500;
        }

        ul.nav a:hover {
            color: var(--link);
        }

        ul.nav span.arrow {
            float: right;
            color: var(--muted);
        }

        footer {
            margin-top: 64px;
            color: var(--muted);
            font-size: 13px;
        }
    </style>
</head>
<body>
<main>
    <h1>Scoop</h1>
    <p class="tag">Legal information</p>
    <ul class="nav">
        <li><a href="./privacy.html">Privacy Policy<span class="arrow">→</span></a></li>
        <li><a href="./imprint.html">Impressum<span class="arrow">→</span></a></li>
    </ul>
    <footer>© Fabian Iwanecki</footer>
</main>
</body>
</html>
